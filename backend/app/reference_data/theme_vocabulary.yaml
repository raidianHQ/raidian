# Canonical theme vocabulary for Raidian Wise reference-data content.
#
# This is the closed, controlled set of tags a card's `primary_themes` and
# `secondary_themes` may draw from. It is deck-agnostic (not specific to
# Rider-Waite-Smith) and shared across `primary_themes` and
# `secondary_themes` -- there is one vocabulary, not two.
#
# Produced by the Reference Data Enrichment & Normalization pass. See
# Documentation/RAIDIAN_WISE_THEME_VOCABULARY_V1.md for the full
# consolidation mapping (which tags were merged into which, and why) and
# the reasoning behind tags that look similar but were deliberately kept
# distinct.
#
# Grouped into loose sections below for human readability only -- the
# loader treats this as one flat, alphabetically-unordered list. Adding a
# new tag here is a deliberate content decision, not a mechanical one: it
# should represent a genuinely distinct concept not already covered by an
# existing tag (see the "kept separate" reasoning in the vocabulary doc
# before adding near-synonyms of something already listed).

