# Approved Scripture reference dataset for the optional Scriptural
# Reflection layer (Documentation/RAIDIAN_WISE_PRODUCT_SPEC_V1.md Section
# 15). Deliberately separate content from card meanings/
# theme_vocabulary.yaml -- see that section's explicit "Card -> God's
# message" ban: these entries respond to a THEME, never to a card.
#
# No passage TEXT is stored here (Section 15.1's licensing constraint --
# "Do not embed copyrighted Bible translation text in the MVP"). Each
# entry is only the reference itself (book/chapter/verse) plus short,
# original commentary written for this project (context_note,
# reflection_connection) -- never a quotation.
#
# `theme` must already exist verbatim in theme_vocabulary.yaml (enforced
# by app/seed/loader.py) -- Scripture reuses the Interpretation Engine's
# own vocabulary rather than maintaining an independent taxonomy
# (RAIDIAN_WISE_PRODUCT_SPEC_V1.md Section 15.3's own instruction).
#
# `translation` is a citation label only (never resolved to verse text
# today -- Section 16, Q5 remains open); only public-domain translations
# are approved (app/seed/loader.py's APPROVED_SCRIPTURE_TRANSLATIONS).
#
# Still only a subset of theme_vocabulary.yaml's full tag set (89 of 107
# themes as of this batch) -- expanded in three passes:
#   1) an initial 9 themes: fear, anxiety, patience, relationships, grief,
#      hope, uncertainty, discernment, clarity.
#   2) the Scripture coverage audit's "Strong" tier (39 themes):
#      new_beginnings, authority, stability, discipline, mentorship,
#      emotional_connection, compassion, nurturing, joy, contentment,
#      loss, mystery, inner_strength, courage, solitude, choice,
#      fairness, accountability, truth, honest_communication, conflict,
#      hardship, burden, exhaustion, transformation, letting_go,
#      revelation, reckoning, renewal, healing, rest, vigilance,
#      completion, wholeness, abundance, skill_and_craft, diligence,
#      generosity, community.
#   3) the audit's remaining Tier 1 ("Strong", 24 themes) and Tier 2
#      ("Moderate", 17 themes) proposals, approved together as one
#      batch: willpower, ambition, breakthrough, structure, tradition,
#      hidden_knowledge, introspection, indecision, upheaval,
#      self_evaluation, legacy, material_security, reliability,
#      entrapment, memory, creativity, opportunity, risk_taking, focus,
#      determination, attachment, recovery, collaboration, authenticity
#      (Tier 1); intuition, inner_guidance, adaptability, strategy,
#      illusion, endings, transition, cycles, potential, exploration,
#      openness, control, recognition, fulfillment, vitality,
#      romantic_pursuit, curiosity (Tier 2 -- each framed with explicit
#      care in its reflection_connection where the passage is closely
#      related but not a literal synonym for the theme, e.g. self-control
#      for "control", Spirit-guidance for "intuition"/"inner_guidance").
# Mapping a new theme here is a deliberate content decision (a real,
# verifiable reference plus original commentary), never a guess at which
# existing tag some other word "really" meant -- the same
# invented-mapping judgment compounds.py already refuses to make for its
# own named compounds, for the same reason. The audit's remaining
# "Tier 3 / weak" themes (belief_systems, balance, integration,
# values_alignment, communication, diplomacy, practicality,
# resourcefulness, self_sufficiency, patterns, restriction, evasion,
# spontaneity, assertiveness, momentum, idealism, sensuality,
# manifestation -- 18 themes) were deliberately left unmapped: either no
# clean single-verse fit exists without forcing one, or (self_sufficiency)
# mapping one risks implying Scripture endorses something it more often
# cautions against, or (sensuality, manifestation) the theme needs an
# explicit, separate content decision beyond this batch's own scope.
#
# A theme may have more than one approved reference (see discernment
# below). Two related-but-distinct themes may also each carry their own
# approved reference and be treated as a semantic cluster at selection
# time -- app/services/scripture/selection.py's own `_RELATED_THEMES`
# curates which theme pairs are close enough in meaning for this (for
# example discernment/clarity, already paired in this project's own
# authored card content -- see Queen of Swords' primary_themes/
# secondary_themes in rider_waite_smith/swords.yaml). This is a small,
# explicit, hand-reviewed relation, never fuzzy/keyword matching -- see
# that module's own docstring.

- theme: fear
  book: "2 Timothy"
  chapter: 1
  verse_start: 7
  verse_end: null
  reference_display: "2 Timothy 1:7"
  translation: KJV
  context_note: >
    Paul reminds Timothy that the spirit God gives is not one of fear,
    but of power, love, and a sound mind.
  reflection_connection: >
    Where a reading surfaces fear, this passage offers a starting point
    for reflection on where that fear comes from and what steadier
    footing might look like -- not a resolution the cards themselves
    can provide.

- theme: anxiety
  book: Philippians
  chapter: 4
  verse_start: 6
  verse_end: 7
  reference_display: "Philippians 4:6-7"
  translation: KJV
  context_note: >
    Paul encourages the Philippian church to bring their concerns
    forward in prayer rather than carrying them alone, and describes the
    peace that can follow.
  reflection_connection: >
    A reading that names anxiety or uncertainty may invite the same
    question this passage raises: what it would look like to name a
    worry directly rather than let it stay formless.

- theme: patience
