# Approved Scripture reference dataset for the optional Scriptural
# Reflection layer (Documentation/RAIDIAN_WISE_PRODUCT_SPEC_V1.md Section
# 15). Deliberately separate content from card meanings/
# theme_vocabulary.yaml -- see that section's explicit "Card -> God's
# message" ban: these entries respond to a THEME, never to a card.
#
# No passage TEXT is stored here (Section 15.1's licensing constraint --
# "Do not embed copyrighted Bible translation text in the MVP"). Each
# entry is only the reference itself (book/chapter/verse) plus short,
# original commentary written for this project (context_note,
# reflection_connection) -- never a quotation.
#
# `theme` must already exist verbatim in theme_vocabulary.yaml (enforced
# by app/seed/loader.py) -- Scripture reuses the Interpretation Engine's
# own vocabulary rather than maintaining an independent taxonomy
# (RAIDIAN_WISE_PRODUCT_SPEC_V1.md Section 15.3's own instruction).
#
# `translation` is a citation label only (never resolved to verse text
# today -- Section 16, Q5 remains open); only public-domain translations
# are approved (app/seed/loader.py's APPROVED_SCRIPTURE_TRANSLATIONS).
#
# Deliberately small: this seeds only a subset of theme_vocabulary.yaml's
# full tag set -- fear, anxiety, patience, relationships, grief, hope,
# uncertainty, discernment, clarity today. Mapping a new theme here is a
# deliberate content decision (a real, verifiable reference plus original
# commentary), never a guess at which existing tag some other word
# "really" meant -- the same invented-mapping judgment compounds.py
# already refuses to make for its own named compounds, for the same
# reason. Covering more of the vocabulary is future work, gated on that
# same deliberate per-theme decision, not something this seed set
# approximates.
#
# A theme may have more than one approved reference (see discernment
# below). Two related-but-distinct themes may also each carry their own
# approved reference and be treated as a semantic cluster at selection
# time -- app/services/scripture/selection.py's own `_RELATED_THEMES`
# curates which theme pairs are close enough in meaning for this (for
# example discernment/clarity, already paired in this project's own
# authored card content -- see Queen of Swords' primary_themes/
# secondary_themes in rider_waite_smith/swords.yaml). This is a small,
# explicit, hand-reviewed relation, never fuzzy/keyword matching -- see
# that module's own docstring.

- theme: fear
  book: "2 Timothy"
  chapter: 1
  verse_start: 7
  verse_end: null
  reference_display: "2 Timothy 1:7"
  translation: KJV
  context_note: >
    Paul reminds Timothy that the spirit God gives is not one of fear,
    but of power, love, and a sound mind.
  reflection_connection: >
    Where a reading surfaces fear, this passage offers a starting point
    for reflection on where that fear comes from and what steadier
    footing might look like -- not a resolution the cards themselves
    can provide.

- theme: anxiety
  book: Philippians
  chapter: 4
  verse_start: 6
  verse_end: 7
  reference_display: "Philippians 4:6-7"
  translation: KJV
  context_note: >
    Paul encourages the Philippian church to bring their concerns
    forward in prayer rather than carrying them alone, and describes the
    peace that can follow.
  reflection_connection: >
    A reading that names anxiety or uncertainty may invite the same
    question this passage raises: what it would look like to name a
    worry directly rather than let it stay formless.

- theme: patience
  book: James
  chapter: 1
  verse_start: 2
  verse_end: 4
  reference_display: "James 1:2-4"
  translation: KJV
  context_note: >
    James frames trials as an opportunity for patience to mature into
    steadiness, rather than something to be resented or rushed through.
  reflection_connection: >
    Where a reading points toward patience, this passage offers a
    different lens on waiting -- not passive delay, but something that
    can develop character over time.

- theme: relationships
  book: 1 Corinthians
  chapter: 13
  verse_start: 4
  verse_end: 7
  reference_display: "1 Corinthians 13:4-7"
  translation: KJV
  context_note: >
    Paul's description of love as patient and kind, offered to the
    Corinthian church as a standard for how people treat one another.
  reflection_connection: >
    A reading centered on relationships may be worth holding alongside
    this description -- not as a test to pass, but as a set of
    questions about how a relationship is actually being lived out.

- theme: grief
  book: Psalms
  chapter: 34
  verse_start: 18
  verse_end: null
  reference_display: "Psalm 34:18"
  translation: KJV
  context_note: >
    A verse from a psalm of David describing God as near to those who
    are brokenhearted and crushed in spirit.
  reflection_connection: >
    Where a reading surfaces grief or loss, this passage offers
    companionship rather than an explanation -- it does not claim to
    resolve grief, only to name that it is not carried alone.

- theme: hope
  book: Romans
  chapter: 15
  verse_start: 13
  verse_end: null
  reference_display: "Romans 15:13"
  translation: KJV
  context_note: >
    Paul's closing blessing over the Roman church, naming God as a
    source of hope, joy, and peace for those who trust.
  reflection_connection: >
    A reading that surfaces hope may be worth sitting with alongside
    this passage's own framing of hope -- as something drawn from
    beyond oneself, not manufactured by will alone.

- theme: uncertainty
  book: Proverbs
  chapter: 3
  verse_start: 5
  verse_end: 6
  reference_display: "Proverbs 3:5-6"
  translation: KJV
  context_note: >
    A well-known proverb urging trust in God rather than reliance on
    one's own understanding alone, particularly when a path forward is
    unclear.
  reflection_connection: >
    Where a reading names uncertainty, this passage raises a genuine
    question worth sitting with, not an answer either the cards or this
    passage can hand over directly.

- theme: discernment
  book: "1 Kings"
  chapter: 3
  verse_start: 9
  verse_end: null
  reference_display: "1 Kings 3:9"
  translation: KJV
  context_note: >
    Solomon, newly made king, asks God for an understanding heart able
    to discern between good and bad, rather than for wealth or victory
    over his enemies.
  reflection_connection: >
    Where a reading points toward discernment, this passage frames it as
    something asked for and cultivated, not a verdict this reading -- or
    any single card in it -- can hand down on its own.

- theme: discernment
  book: Hebrews
  chapter: 5
  verse_start: 14
  verse_end: null
  reference_display: "Hebrews 5:14"
  translation: KJV
  context_note: >
    The writer of Hebrews describes discernment between good and evil as
    a capacity built through practice and maturity, not an instinct
    someone simply has or lacks.
  reflection_connection: >
    A reading that surfaces discernment may be worth holding alongside
    this framing -- less a single right answer to locate, more a habit
    of attention this moment invites.

- theme: clarity
  book: Psalms
  chapter: 119
  verse_start: 105
  verse_end: null
  reference_display: "Psalm 119:105"
  translation: KJV
  context_note: >
    A psalm describing guidance as a lamp for the next step, not a
    floodlight over the whole road ahead.
  reflection_connection: >
    Where a reading calls for clarity, this passage offers a different
    expectation of what clarity can look like -- enough light for what
    is immediately ahead, not necessarily the entire path.
